repos:
  - repo: local
    hooks:
      - id: clover-python-ruff
        name: Clover Python ruff
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: clover-python-format
        name: Clover Python format
        entry: python -m ruff format
        language: system
        types: [python]
      - id: clover-python-tests
        name: Clover Python tests
        entry: python -m pytest
        language: system
        pass_filenames: false
