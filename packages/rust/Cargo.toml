[package]
name = "clover-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust client for the Clover email API"
license = "MIT"
rust-version = "1.82"
repository = "https://github.com/openmirai/clover-sdks"
homepage = "https://github.com/openmirai/clover-sdks/tree/main/packages/rust"
documentation = "https://docs.rs/clover-sdk"
keywords = ["clover", "email", "api", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
