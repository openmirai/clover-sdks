name: Rust SDK release

on:
  push:
    tags: ["rust/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Validate SemVer tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^rust/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches Cargo package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(cargo pkgid --manifest-path Cargo.toml | sed 's/.*@//')"
          test "$TAG" = "rust/v$VERSION"
      - run: cargo fmt --all --check
      - run: cargo test --all-targets --all-features
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: packages/rust/CHANGELOG.md
