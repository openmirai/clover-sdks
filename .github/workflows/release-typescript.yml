name: TypeScript SDK release

on:
  push:
    tags: ["typescript/v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: typescript-sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish @sendclover/sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate SemVer tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^typescript/v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release identity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE="$(node -p "require('./package.json').name")"
          test "$PACKAGE" = "@sendclover/sdk"
          test "$TAG" = "typescript/v$VERSION"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$(npm --version)"
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
          TAG_OBJECT="$(git rev-parse "$TAG^{tag}")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT" --jq '.verification.verified')" = "true"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const { name, version } = JSON.parse(await readFile("package.json", "utf8"));
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`);
            if (response.status === 404) process.exit(0);
            if (response.ok) console.error(`${name}@${version} is already published`);
            else console.error(`npm registry preflight failed with HTTP ${response.status}`);
            process.exit(1);
          '

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm pack --dry-run --json

      - name: Create draft GitHub release
        run: |
          if RELEASE_DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/tmp/clover-release-view.err)"; then
            test "$RELEASE_DRAFT" = "true"
          elif grep -qiE 'release not found|HTTP 404' /tmp/clover-release-view.err; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --title "@sendclover/sdk v${GITHUB_REF_NAME#typescript/v}"
          else
            cat /tmp/clover-release-view.err >&2
            exit 1
          fi

      - name: Publish with npm trusted publishing
        run: npm publish --access public

      - name: Publish GitHub release
        run: |
          for attempt in 1 2 3; do
            gh release edit "$GITHUB_REF_NAME" --draft=false && exit 0
            sleep "$((attempt * 2))"
          done
          exit 1
