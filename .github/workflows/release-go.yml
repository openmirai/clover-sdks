name: Go SDK release

on:
  push:
    tags: ["packages/go/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/go
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Validate SemVer tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^packages/go/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.x" }
      - name: Verify module tag is the release source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$(go list -m)" = "github.com/openmirai/clover-sdks/packages/go"
          test "$(git describe --exact-match --tags "$GITHUB_SHA")" = "$TAG"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: packages/go/CHANGELOG.md
