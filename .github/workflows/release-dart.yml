name: Dart release

on:
  push:
    tags: ["dart/v*"]

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/dart/v')
    runs-on: ubuntu-24.04
    environment: pub-dev
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@v7
      - name: Validate SemVer tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^dart/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Verify tag matches pubspec version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          test "$TAG" = "dart/v$VERSION"
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart test
      - run: dart pub publish --force
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
