name: Java SDK release

on:
  push:
    tags: ["java/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/java
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Validate SemVer tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^java/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: packages/java/pom.xml
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Verify tag matches Maven version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(mvn -q -DforceStdout \
            help:evaluate -Dexpression=project.version)"
          test "$TAG" = "java/v$VERSION"
      - run: mvn -B -ntp verify
      - name: Publish signed artifact to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          test -n "$MAVEN_USERNAME"
          test -n "$MAVEN_PASSWORD"
          mvn -B -ntp -Prelease deploy -DskipTests
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: packages/java/CHANGELOG.md
